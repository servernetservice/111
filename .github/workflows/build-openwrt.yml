name: Build OpenWrt 25.12

on:
  workflow_dispatch:          # 手动触发
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-openwrt.yml'

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-25.12
  FEEDS_CONF: feeds.conf.default
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
    # ─────────────────────────────────────────
    # 步骤 1：清理磁盘（编译前必须，释放 30GB+）
    # ─────────────────────────────────────────
    - name: 清理磁盘空间
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false          # 保留 actions 缓存
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: 显示剩余磁盘空间
      run: df -hT

    # ─────────────────────────────────────────
    # 步骤 2：Checkout 本仓库
    # ─────────────────────────────────────────
    - name: Checkout
      uses: actions/checkout@v4

    # ─────────────────────────────────────────
    # 步骤 3：安装编译依赖
    # ─────────────────────────────────────────
    - name: 安装编译依赖
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
          gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man \
          intltool lib32gcc-s1 libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev \
          libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip \
          python3-ply python3-pyelftools qemu-utils re2c rsync scons squashfs-tools \
          subversion swig texinfo uglifyjs unzip vim wget xmlto xxd zlib1g-dev zstd
        sudo apt-get clean
        sudo timedatectl set-timezone "$TZ"

    # ─────────────────────────────────────────
    # 步骤 4：拉取 OpenWrt 源码
    # ─────────────────────────────────────────
    - name: 拉取 OpenWrt 源码
      run: |
        git clone --depth=1 --branch $REPO_BRANCH $REPO_URL openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt 2>/dev/null || true

    # ─────────────────────────────────────────
    # 步骤 5：添加自定义 feeds
    # ─────────────────────────────────────────
    - name: 添加自定义 feeds
      run: |
        cd openwrt
        cat >> feeds.conf.default <<'EOF'
        # PassWall（不含内核模块）
        src-git passwall_packages https://github.com/xiaorouji/openwrt-passwall-packages;main
        src-git passwall https://github.com/xiaorouji/openwrt-passwall;main
        # AdGuardHome（luci app，不含内核）
        src-git adguardhome https://github.com/rufengsuixing/luci-app-adguardhome;master
        # SmartDNS
        src-git smartdns https://github.com/pymumu/openwrt-smartdns;master
        src-git luci_smartdns https://github.com/pymumu/luci-app-smartdns;master
        # DDNS-go（支持 Cloudflare IPv4/IPv6）
        src-git ddns_go https://github.com/sirpdboy/luci-app-ddns-go;main
        # syncdial 多拨
        src-git syncdial https://github.com/frasevent/syncdial;master
        EOF

    # ─────────────────────────────────────────
    # 步骤 6：更新并安装 feeds
    # ─────────────────────────────────────────
    - name: 更新并安装 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    # ─────────────────────────────────────────
    # 步骤 7：生成 .config 配置
    # ─────────────────────────────────────────
    - name: 写入编译配置 .config
      run: |
        cd openwrt
        cat > .config <<'EOF'
        # ── 目标平台 ──────────────────────────────
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_DEVICE_generic=y

        # ── 固件格式（生成通用 generic 镜像） ─────
        CONFIG_TARGET_IMAGES_GZIP=y
        CONFIG_GRUB_EFI_IMAGES=y
        CONFIG_GRUB_IMAGES=y
        # 镜像大小（根据需要调整，单位 MB）
        CONFIG_TARGET_KERNEL_PARTSIZE=32
        CONFIG_TARGET_ROOTFS_PARTSIZE=512

        # ── IPv6 ──────────────────────────────────
        CONFIG_IPV6=y
        CONFIG_KERNEL_IPV6=y
        CONFIG_PACKAGE_ipv6helper=y
        CONFIG_PACKAGE_odhcp6c=y
        CONFIG_PACKAGE_odhcpd-ipv6only=y

        # ── LuCI 界面 + 中文语言包 ─────────────────
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-base=y
        CONFIG_PACKAGE_luci-compat=y
        CONFIG_PACKAGE_luci-mod-admin-full=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-firewall-zh-cn=y
        CONFIG_PACKAGE_luci-i18n-opkg-zh-cn=y

        # ── Docker ────────────────────────────────
        CONFIG_PACKAGE_dockerd=y
        CONFIG_PACKAGE_docker-compose=y
        CONFIG_PACKAGE_luci-app-dockerman=y
        CONFIG_PACKAGE_luci-i18n-dockerman-zh-cn=y

        # ── AdGuardHome（仅 luci-app，无内核模块）──
        CONFIG_PACKAGE_luci-app-adguardhome=y
        # 不选内核 nftables/kmod-nft-* 相关

        # ── PassWall（仅 luci-app，无内核模块）────
        CONFIG_PACKAGE_luci-app-passwall=y
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_Xray=y
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_sing-box=y
        CONFIG_PACKAGE_luci-app-passwall_INCLUDE_ShadowsocksR_Rust_Client=y
        CONFIG_PACKAGE_luci-i18n-passwall-zh-cn=y
        # 不选 iptables/nftables 内核转发模块

        # ── SmartDNS ──────────────────────────────
        CONFIG_PACKAGE_smartdns=y
        CONFIG_PACKAGE_luci-app-smartdns=y
        CONFIG_PACKAGE_luci-i18n-smartdns-zh-cn=y

        # ── DDNS-go（Cloudflare IPv4/IPv6 均支持）─
        CONFIG_PACKAGE_ddns-go=y
        CONFIG_PACKAGE_luci-app-ddns-go=y
        CONFIG_PACKAGE_luci-i18n-ddns-go-zh-cn=y

        # ── syncdial 多拨 ─────────────────────────
        CONFIG_PACKAGE_syncdial=y
        CONFIG_PACKAGE_luci-app-syncdial=y
        CONFIG_PACKAGE_luci-i18n-syncdial-zh-cn=y
        CONFIG_PACKAGE_macvlan=y
        CONFIG_PACKAGE_kmod-macvlan=y

        # ── 网卡驱动 ──────────────────────────────
        # Intel E1000 / E1000e
        CONFIG_PACKAGE_kmod-e1000=y
        CONFIG_PACKAGE_kmod-e1000e=y
        # USB 网卡（通用 CDC / RNDIS / AX88179 等）
        CONFIG_PACKAGE_kmod-usb-net=y
        CONFIG_PACKAGE_kmod-usb-net-cdc-ether=y
        CONFIG_PACKAGE_kmod-usb-net-rndis=y
        CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
        CONFIG_PACKAGE_kmod-usb-net-rtl8150=y
        CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
        CONFIG_PACKAGE_kmod-usb2=y
        CONFIG_PACKAGE_kmod-usb3=y

        # ── 常用基础工具 ──────────────────────────
        CONFIG_PACKAGE_bash=y
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_wget-ssl=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_openssh-sftp-server=y
        CONFIG_PACKAGE_tcpdump=y
        CONFIG_PACKAGE_iperf3=y
        CONFIG_PACKAGE_nano=y
        CONFIG_PACKAGE_lsblk=y
        CONFIG_PACKAGE_fdisk=y
        CONFIG_PACKAGE_coreutils=y
        CONFIG_PACKAGE_coreutils-nohup=y

        # ── 防火墙 ────────────────────────────────
        CONFIG_PACKAGE_nftables=y
        CONFIG_PACKAGE_kmod-nft-core=y
        CONFIG_PACKAGE_firewall4=y
        CONFIG_PACKAGE_luci-app-firewall=y
        EOF

    # ─────────────────────────────────────────
    # 步骤 8：自定义脚本（可选补丁）
    # ─────────────────────────────────────────
    - name: 自定义脚本（补丁/文件覆盖）
      run: |
        cd openwrt
        # 示例：修改默认 IP
        # sed -i 's/192.168.1.1/192.168.10.1/g' package/base-files/files/bin/config_generate

    # ─────────────────────────────────────────
    # 步骤 9：make defconfig 补全默认配置
    # ─────────────────────────────────────────
    - name: make defconfig
      run: |
        cd openwrt
        make defconfig

    # ─────────────────────────────────────────
    # 步骤 10：下载编译所需源码包
    # ─────────────────────────────────────────
    - name: 下载软件包源码
      run: |
        cd openwrt
        make download -j$(nproc)
        # 删除下载失败的小文件（< 1KB）
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -delete

    # ─────────────────────────────────────────
    # 步骤 11：编译固件
    # ─────────────────────────────────────────
    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo "线程数: $(nproc)"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    # ─────────────────────────────────────────
    # 步骤 12：检查磁盘使用
    # ─────────────────────────────────────────
    - name: 编译后磁盘使用情况
      if: always()
      run: df -hT

    # ─────────────────────────────────────────
    # 步骤 13：整理固件文件
    # ─────────────────────────────────────────
    - name: 整理固件
      id: organize
      if: steps.compile.outputs.status == 'success'
      run: |
        cd openwrt/bin/targets/*/*
        # 删除 packages 目录，只保留固件
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    # ─────────────────────────────────────────
    # 步骤 14：上传全部固件（包含 EFI/Legacy/img.gz）
    # ─────────────────────────────────────────
    - name: 上传固件 Artifacts（全部文件）
      uses: actions/upload-artifact@v4
      if: steps.organize.outputs.status == 'success'
      with:
        name: OpenWrt-x86_64-generic${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}
        retention-days: 7

    # ─────────────────────────────────────────
    # 步骤 15：上传 packages（可选，方便单独下载）
    # ─────────────────────────────────────────
    - name: 上传 packages Artifacts
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success'
      with:
        name: OpenWrt-packages${{ env.FILE_DATE }}
        path: openwrt/bin/packages
        retention-days: 7
