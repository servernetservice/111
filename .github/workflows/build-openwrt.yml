#=================================================
# OpenWrt 24.10 完整编译工作流 - 最新版本
# 包含：Passwall, SmartDNS, DDNS, AdGuardHome, 磁盘管理
# 更新时间：2026-04-17
#=================================================

name: Build OpenWrt 24.10 Latest

on:
  workflow_dispatch:
    inputs:
      ssh_debug:
        description: '启用 SSH 调试'
        required: false
        default: 'false'

env:
  REPO_URL: https://github.com/openwrt/openwrt
  REPO_BRANCH: openwrt-24.10
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 初始化环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        echo "======================================"
        echo "开始清理磁盘空间"
        echo "======================================"
        df -hT
        
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf /usr/local/graalvm
        sudo rm -rf /usr/local/.ghcup
        sudo rm -rf /usr/local/share/powershell
        sudo rm -rf /usr/local/share/chromium
        sudo rm -rf /usr/local/lib/node_modules
        
        sudo docker image prune --all --force
        
        sudo apt-get purge -y '^apache2' '^php' '^mysql' '^postgresql' '^mongodb' || true
        sudo apt-get purge -y azure-cli google-cloud-sdk google-chrome-stable firefox powershell mono-devel || true
        sudo apt-get autoremove -y
        sudo apt-get clean
        
        echo "======================================"
        echo "磁盘清理完成"
        df -hT
        echo "======================================"

    - name: 安装编译依赖
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo apt-get update
        sudo apt-get -y install \
          ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext \
          gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 \
          libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
          libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
          libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch \
          pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils \
          rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip \
          vim wget xmlto xxd zlib1g-dev
        
        sudo timedatectl set-timezone "$TZ"

    - name: 克隆 OpenWrt 源码
      run: |
        git clone --depth=1 $REPO_URL -b $REPO_BRANCH openwrt
        cd openwrt
        echo "OPENWRT_PATH=$PWD" >> $GITHUB_ENV

    - name: 配置自定义 Feeds
      run: |
        cd openwrt
        cat > feeds.conf.default <<EOF
        src-git packages https://github.com/openwrt/packages.git;openwrt-24.10
        src-git luci https://github.com/openwrt/luci.git;openwrt-24.10
        src-git routing https://github.com/openwrt/routing.git;openwrt-24.10
        src-git telephony https://github.com/openwrt/telephony.git;openwrt-24.10
        EOF
        
        echo "Feeds 配置完成（仅官方源）"
        cat feeds.conf.default

    - name: 更新 Feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a

    - name: 安装 Feeds
      run: |
        cd openwrt
        ./scripts/feeds install -a

    - name: 添加第三方软件包
      run: |
        cd openwrt
        
        # 创建自定义软件包目录
        mkdir -p package/custom
        
        # SmartDNS
        echo "添加 SmartDNS..."
        git clone --depth=1 https://github.com/pymumu/openwrt-smartdns.git package/custom/smartdns
        git clone --depth=1 -b lede https://github.com/pymumu/luci-app-smartdns.git package/custom/luci-app-smartdns
        
        # AdGuardHome
        echo "添加 AdGuardHome..."
        git clone --depth=1 https://github.com/rufengsuixing/luci-app-adguardhome.git package/custom/luci-app-adguardhome
        
        # Passwall 依赖和主程序
        echo "添加 Passwall..."
        git clone --depth=1 https://github.com/xiaorouji/openwrt-passwall-packages.git package/custom/passwall-packages
        git clone --depth=1 https://github.com/xiaorouji/openwrt-passwall.git package/custom/passwall
        
        echo "第三方软件包添加完成"
        ls -la package/custom/

    - name: 生成配置文件
      run: |
        cd openwrt
        
        cat > .config <<'EOF'
        #
        # 目标平台
        #
        CONFIG_TARGET_x86=y
        CONFIG_TARGET_x86_64=y
        CONFIG_TARGET_x86_64_DEVICE_generic=y
        
        #
        # 固件分区大小
        #
        CONFIG_TARGET_KERNEL_PARTSIZE=64
        CONFIG_TARGET_ROOTFS_PARTSIZE=1024
        
        #
        # 固件格式
        #
        CONFIG_TARGET_ROOTFS_TARGZMA=y
        CONFIG_TARGET_ROOTFS_EXT4FS=y
        CONFIG_TARGET_ROOTFS_SQUASHFS=y
        CONFIG_GRUB_IMAGES=y
        CONFIG_GRUB_EFI_IMAGES=y
        CONFIG_VDI_IMAGES=y
        CONFIG_VMDK_IMAGES=y
        CONFIG_QCOW2_IMAGES=y
        CONFIG_TARGET_IMAGES_GZIP=y
        
        #
        # IPv6 支持
        #
        CONFIG_PACKAGE_ipv6helper=y
        CONFIG_PACKAGE_dnsmasq_full_dhcpv6=y
        CONFIG_PACKAGE_6in4=y
        CONFIG_PACKAGE_6rd=y
        CONFIG_PACKAGE_6to4=y
        
        #
        # LuCI
        #
        CONFIG_PACKAGE_luci=y
        CONFIG_PACKAGE_luci-ssl-openssl=y
        CONFIG_PACKAGE_luci-theme-bootstrap=y
        
        #
        # 应用
        #
        CONFIG_PACKAGE_luci-app-ddns=y
        CONFIG_PACKAGE_ddns-scripts=y
        CONFIG_PACKAGE_ddns-scripts-services=y
        
        CONFIG_PACKAGE_luci-app-smartdns=y
        CONFIG_PACKAGE_smartdns=y
        
        CONFIG_PACKAGE_luci-app-adguardhome=y
        
        CONFIG_PACKAGE_luci-app-passwall=y
        
        CONFIG_PACKAGE_luci-app-diskman=y
        CONFIG_PACKAGE_block-mount=y
        CONFIG_PACKAGE_e2fsprogs=y
        CONFIG_PACKAGE_kmod-fs-ext4=y
        CONFIG_PACKAGE_kmod-usb-storage=y
        CONFIG_PACKAGE_kmod-usb-storage-uas=y
        
        #
        # 网卡驱动
        #
        CONFIG_PACKAGE_kmod-e1000=y
        CONFIG_PACKAGE_kmod-e1000e=y
        CONFIG_PACKAGE_kmod-igb=y
        
        CONFIG_PACKAGE_kmod-usb-net=y
        CONFIG_PACKAGE_kmod-usb-net-asix=y
        CONFIG_PACKAGE_kmod-usb-net-asix-ax88179=y
        CONFIG_PACKAGE_kmod-usb-net-rtl8150=y
        CONFIG_PACKAGE_kmod-usb-net-rtl8152=y
        
        #
        # 常用工具
        #
        CONFIG_PACKAGE_wget-ssl=y
        CONFIG_PACKAGE_curl=y
        CONFIG_PACKAGE_htop=y
        CONFIG_PACKAGE_nano=y
        EOF
        
        make defconfig
        
        echo "======================================"
        echo "配置文件已生成"
        echo "======================================"

    - name: 下载编译依赖
      run: |
        cd openwrt
        echo "开始下载软件包..."
        make download -j8
        
        # 检查下载失败的文件
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译工具链
      id: tools
      run: |
        cd openwrt
        echo "======================================"
        echo "编译 tools (使用 $(nproc) 线程)"
        echo "======================================"
        
        make tools/compile -j$(nproc) V=s || {
          echo "多线程失败，尝试单线程..."
          make tools/compile -j1 V=s || {
            echo "❌ tools 编译失败"
            exit 1
          }
        }
        
        echo "======================================"
        echo "编译 toolchain (使用 $(nproc) 线程)"
        echo "======================================"
        
        make toolchain/compile -j$(nproc) V=s || {
          echo "多线程失败，尝试单线程..."
          make toolchain/compile -j1 V=s || {
            echo "❌ toolchain 编译失败"
            exit 1
          }
        }
        
        echo "✅ 工具链编译成功"

    - name: 编译软件包
      id: packages
      run: |
        cd openwrt
        echo "======================================"
        echo "编译软件包 (使用 $(nproc) 线程)"
        echo "======================================"
        
        make package/compile -j$(nproc) V=s || {
          echo "多线程失败，尝试单线程..."
          make package/compile -j1 V=s || {
            echo "❌ 软件包编译失败"
            if [ -f "logs/package/error.txt" ]; then
              echo "错误日志："
              cat logs/package/error.txt
            fi
            exit 1
          }
        }
        
        echo "✅ 软件包编译成功"

    - name: 编译固件
      id: compile
      run: |
        cd openwrt
        echo "======================================"
        echo "编译固件 (使用 $(nproc) 线程)"
        echo "======================================"
        
        make target/compile -j$(nproc) V=s || make target/compile -j1 V=s
        make package/install -j$(nproc) V=s || make package/install -j1 V=s
        make target/install -j$(nproc) V=s || make target/install -j1 V=s
        make checksum
        
        # 验证编译结果
        if [ ! -d "bin/targets/x86/64" ]; then
          echo "❌ 固件目录不存在"
          ls -laR bin/ || echo "bin 目录不存在"
          exit 1
        fi
        
        echo "======================================"
        echo "✅ 固件编译成功！"
        echo "======================================"
        ls -lh bin/targets/x86/64/
        
        echo "status=success" >> $GITHUB_OUTPUT
        echo "FIRMWARE_PATH=$PWD/bin/targets/x86/64" >> $GITHUB_ENV
        echo "BUILD_DATE=$(date +%Y%m%d_%H%M)" >> $GITHUB_ENV

    - name: 检查磁盘使用
      if: always()
      run: df -hT

    - name: 上传编译日志
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: build-logs-${{ env.BUILD_DATE }}
        path: |
          openwrt/logs/
          openwrt/.config
        retention-days: 7

    - name: 整理固件文件
      if: steps.compile.outputs.status == 'success'
      run: |
        cd ${{ env.FIRMWARE_PATH }}
        rm -rf packages
        
        echo "固件文件："
        ls -lh
        
        # 重命名文件以便识别
        for file in openwrt-*; do
          if [ -f "$file" ]; then
            newname="OpenWrt-24.10-${{ env.BUILD_DATE }}-${file#openwrt-}"
            mv "$file" "$newname"
            echo "重命名: $file -> $newname"
          fi
        done

    - name: 上传固件到 Artifacts
      uses: actions/upload-artifact@v4
      if: steps.compile.outputs.status == 'success'
      with:
        name: OpenWrt-24.10-firmware-${{ env.BUILD_DATE }}
        path: ${{ env.FIRMWARE_PATH }}/*
        retention-days: 30

    - name: 生成 Release 说明
      if: steps.compile.outputs.status == 'success'
      run: |
        cat > release.md <<'EOF'
        ## 🚀 OpenWrt 24.10 固件
        
        ### 📦 包含功能
        
        **LuCI 应用:**
        - ✅ Passwall (科学上网)
        - ✅ SmartDNS (智能 DNS)
        - ✅ DDNS (动态域名)
        - ✅ AdGuardHome (广告过滤)
        - ✅ 磁盘管理 (Diskman)
        
        **系统功能:**
        - ✅ Bootstrap 主题
        - ✅ IPv6 完整支持
        - ✅ SSL/HTTPS 管理界面
        
        **硬件支持:**
        - ✅ Intel E1000/E1000e/IGB 网卡
        - ✅ USB 网卡 (ASIX/Realtek)
        - ✅ USB 存储设备
        
        ### 💾 固件信息
        
        - **平台:** x86_64 Generic
        - **内核分区:** 64 MB
        - **根分区:** 1024 MB
        - **编译时间:** ${{ env.BUILD_DATE }}
        
        ### 📥 固件格式
        
        | 格式 | 用途 |
        |------|------|
        | `squashfs-combined.img.gz` | 推荐 - 支持快照恢复 |
        | `ext4-combined.img.gz` | 可读写系统分区 |
        | `.vmdk` | VMware 虚拟机 |
        | `.vdi` | VirtualBox 虚拟机 |
        | `.qcow2` | KVM/Proxmox VE |
        
        ### 🔧 安装方法
        
        **物理机安装:**
        ```bash
        gunzip *.img.gz
        sudo dd if=*.img of=/dev/sdX bs=4M status=progress
        sync
        ```
        
        **虚拟机:** 直接导入对应格式的镜像文件
        
        ### 🌐 默认配置
        
        - **IP 地址:** 192.168.1.1
        - **用户名:** root
        - **密码:** password
        - **LuCI 访问:** http://192.168.1.1
        
        ---
        
        ⚠️ **首次登录后请立即修改密码！**
        EOF
        
        echo "RELEASE_TAG=v24.10-${{ env.BUILD_DATE }}" >> $GITHUB_ENV

    - name: 发布到 Release
      uses: softprops/action-gh-release@v1
      if: steps.compile.outputs.status == 'success'
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: OpenWrt 24.10 - ${{ env.BUILD_DATE }}
        body_path: release.md
        files: ${{ env.FIRMWARE_PATH }}/*

    - name: 清理旧的 Workflows
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 1
        keep_minimum_runs: 3

    - name: 清理旧的 Releases
      uses: dev-drprasad/delete-older-releases@v0.3.2
      if: steps.compile.outputs.status == 'success'
      with:
        keep_latest: 5
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
